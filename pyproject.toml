[project]
name = "propog-competitor-agent"
version = "0.1.0"
description = "Competitor analysis agent for propOG: finds and compares new residential projects near a builder's project"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=1.2",
    "langchain-anthropic>=1.7",
    "langchain-core>=1.0",
    "anthropic>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "langchain-groq>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
